name: Check AutoClips app

on:
  push:
    paths:
      - "app.py"
      - ".github/workflows/check-autoclips.yml"
  pull_request:
    paths:
      - "app.py"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile app.py
